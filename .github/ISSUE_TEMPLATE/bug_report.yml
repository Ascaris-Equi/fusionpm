name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide commands, inputs, and steps.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, package versions, hardware if relevant.
      placeholder: |
        OS:
        Python:
        PyTorch:
        Gradio:
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Error message or logs
      description: Paste the full traceback or log.
      render: shell

  - type: textarea
    id: input
    attributes:
      label: Example input
      description: Provide a minimal non-sensitive example input if possible.
      render: text
